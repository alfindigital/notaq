name: CI

# Cek kualitas otomatis: jalan di setiap push & setiap pull request.
# Hanya verifikasi (typecheck + test + build) — tidak deploy, tidak butuh secret.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
